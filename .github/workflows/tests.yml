name: Testes de API

on:
  workflow_dispatch:

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_SENHA: ${{ secrets.ADMIN_SENHA }}
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar API e executar testes
        run: |
          node src/server.js > /tmp/gestao-de-alunos-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/gestao-de-alunos-api.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          npx mocha "test/trabalho_conclusao/**/*.test.js" --exit
